<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>闹钟与计时器</title>
  <link rel="stylesheet" href="styles/clock.css" />
</head>
<body>
  <main class="clock-shell">
    <header class="clock-hero">
      <p class="eyebrow">TIME WITH YOUR PET</p>
      <h1>闹钟与计时器</h1>
      <p>时间会往前走。水滴鱼替你看着。</p>
    </header>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <section id="ringing-card" class="card ringing-card" hidden>
      <div>
        <span id="ringing-kind" class="card-kicker">时间到了</span>
        <h2 id="ringing-title">该抬头了</h2>
      </div>
      <div class="button-row">
        <button id="snooze-alert" class="secondary" type="button">稍后 5 分钟</button>
        <button id="dismiss-alert" class="primary" type="button">知道了</button>
      </div>
    </section>

    <section class="card timer-card">
      <div class="section-heading">
        <div>
          <span class="card-kicker">TIMER</span>
          <h2>计时器</h2>
        </div>
        <span id="timer-state" class="status-pill">还没有开始</span>
      </div>

      <div id="active-timer" class="active-timer" hidden>
        <div id="timer-label" class="timer-label">计时中</div>
        <output id="timer-countdown" class="timer-countdown">25:00</output>
        <div class="button-row">
          <button id="toggle-timer" class="secondary" type="button">暂停</button>
          <button id="extend-timer" class="secondary" type="button">+5 分钟</button>
          <button id="cancel-timer" class="ghost danger" type="button">取消</button>
        </div>
      </div>

      <div id="timer-starter">
        <div class="quick-grid" aria-label="快速计时">
          <button type="button" data-quick-minutes="5">5 分钟</button>
          <button type="button" data-quick-minutes="15">15 分钟</button>
          <button type="button" data-quick-minutes="25"><strong>25</strong> 专注</button>
          <button type="button" data-quick-minutes="45">45 分钟</button>
        </div>
        <form id="timer-form" class="compact-form">
          <label>
            <span>自定义分钟</span>
            <input id="timer-minutes" type="number" min="1" max="10080" value="30" required />
          </label>
          <label class="grow">
            <span>名称（可选）</span>
            <input id="timer-name" maxlength="60" placeholder="例如：泡茶、专注" />
          </label>
          <button class="primary start-button" type="submit">开始计时</button>
        </form>
      </div>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <span class="card-kicker">ALARM</span>
          <h2>设置闹钟</h2>
        </div>
        <button id="cancel-alarm-edit" class="ghost" type="button" hidden>取消编辑</button>
      </div>

      <form id="alarm-form" class="alarm-form">
        <div class="alarm-time-row">
          <label>
            <span>时间</span>
            <input id="alarm-time" type="time" required />
          </label>
          <label class="grow">
            <span>名称（可选）</span>
            <input id="alarm-name" maxlength="60" placeholder="例如：开会、吃药" />
          </label>
        </div>
        <label>
          <span>重复</span>
          <select id="alarm-repeat">
            <option value="once">仅一次</option>
            <option value="daily">每天</option>
            <option value="workdays">工作日</option>
            <option value="weekly">自选星期</option>
          </select>
        </label>
        <label id="alarm-date-row">
          <span>日期</span>
          <input id="alarm-date" type="date" required />
        </label>
        <fieldset id="weekday-row" class="weekday-row" hidden>
          <legend>星期</legend>
          <label><input type="checkbox" value="1" /><span>一</span></label>
          <label><input type="checkbox" value="2" /><span>二</span></label>
          <label><input type="checkbox" value="3" /><span>三</span></label>
          <label><input type="checkbox" value="4" /><span>四</span></label>
          <label><input type="checkbox" value="5" /><span>五</span></label>
          <label><input type="checkbox" value="6" /><span>六</span></label>
          <label><input type="checkbox" value="0" /><span>日</span></label>
        </fieldset>
        <button id="save-alarm" class="primary full-width" type="submit">设置闹钟</button>
      </form>

      <div class="divider"></div>
      <div class="list-heading">
        <h3>接下来的闹钟</h3>
        <span id="alarm-count">0 个</span>
      </div>
      <div id="alarm-list" class="alarm-list"></div>
      <p id="alarm-empty" class="empty-state">还没有闹钟。设一个以后，水滴鱼会把闹钟拿在手边。</p>
    </section>

    <section class="card preferences-card">
      <div class="section-heading">
        <div>
          <span class="card-kicker">SOUND</span>
          <h2>响铃方式</h2>
        </div>
      </div>
      <div class="sound-row">
        <label class="switch-row">
          <span><strong>闹钟声音</strong><small>闹钟到点时播放</small></span>
          <input id="alarm-sound-enabled" type="checkbox" />
        </label>
        <div class="sound-picker">
          <select id="alarm-sound"></select>
          <button id="preview-alarm-sound" class="secondary" type="button">试听</button>
        </div>
      </div>
      <div class="sound-row">
        <label class="switch-row">
          <span><strong>计时结束声音</strong><small>倒计时归零时播放</small></span>
          <input id="timer-sound-enabled" type="checkbox" />
        </label>
        <div class="sound-picker">
          <select id="timer-sound"></select>
          <button id="preview-timer-sound" class="secondary" type="button">试听</button>
        </div>
      </div>
      <label class="switch-row quiet-switch">
        <span><strong>安静时段仍然响铃</strong><small>这是你主动设置的提醒，默认不会静音</small></span>
        <input id="clock-quiet-sound" type="checkbox" />
      </label>
    </section>

    <p class="boundary-note">水滴鱼运行时会准点提醒；如果完全退出，只能在下次打开或电脑唤醒后补提醒。</p>
  </main>
  <script src="core/ui-i18n.js"></script>
  <script src="clock.js"></script>
</body>
</html>
