name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    name: Build native ${{ matrix.asset_arch }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift_arch: arm64
            asset_arch: arm64
          - swift_arch: x86_64
            asset_arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and native version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          native_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native-appkit/App/Info.plist)"
          test "$tag_version" = "$native_version"
      - name: Run native self-checks
        if: matrix.swift_arch == 'arm64'
        working-directory: native-appkit
        run: make test
      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          certificate_path="$RUNNER_TEMP/blobfish-developer-id.p12"
          keychain_path="$RUNNER_TEMP/blobfish-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
      - name: Package Developer ID app
        working-directory: native-appkit
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          test -n "$CODE_SIGN_IDENTITY"
          case "$CODE_SIGN_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) printf 'Release identity must be a Developer ID Application certificate.\n' >&2; exit 1 ;;
          esac
          make app ARCH=${{ matrix.swift_arch }}
      - name: Verify Developer ID identity
        shell: bash
        env:
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          app="native-appkit/.build/水滴鱼.app"
          test "$MACOS_NOTARY_TEAM_ID" != ""
          [[ "$MACOS_NOTARY_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          actual_team="$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          test "$actual_team" = "$MACOS_NOTARY_TEAM_ID"
          requirement="anchor apple generic and identifier \"com.blobfish.desktop-pet.native\" and certificate leaf[subject.OU] = \"$MACOS_NOTARY_TEAM_ID\""
          /usr/bin/codesign --verify --strict --verbose=2 -R "$requirement" "$app"
      - name: Notarize and staple app
        shell: bash
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_NOTARY_APPLE_ID"
          test -n "$MACOS_NOTARY_TEAM_ID"
          test -n "$MACOS_NOTARY_PASSWORD"
          app="native-appkit/.build/水滴鱼.app"
          upload="$RUNNER_TEMP/blobfish-notarization-${{ matrix.asset_arch }}.zip"
          COPYFILE_DISABLE=1 ditto -c -k --norsrc --noextattr --keepParent "$app" "$upload"
          xcrun notarytool submit "$upload" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Archive notarized app
        working-directory: native-appkit
        run: ARCH=${{ matrix.swift_arch }} sh scripts/archive-app.sh
      - name: Verify package architecture and signature
        shell: bash
        run: |
          set -euo pipefail
          app="native-appkit/.build/水滴鱼.app"
          executable="$app/Contents/MacOS/BlobfishNative"
          helper="$app/Contents/Resources/native/blobfish-agent-event-sender"
          test "$(/usr/bin/lipo -archs "$executable")" = "${{ matrix.swift_arch }}"
          test "$(/usr/bin/lipo -archs "$helper")" = "${{ matrix.swift_arch }}"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^Signature=//p')" != "adhoc"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.asset_arch }}
          path: native-appkit/.build/BlobfishNative-*-macOS-${{ matrix.asset_arch }}.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          path: release
          merge-multiple: true
      - name: Generate native update manifest
        run: node scripts/generate-native-release-manifest.js arm64 x64
      - name: Write release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<NOTES
          ## 水滴鱼 ${version}

          - \`BlobfishNative-${version}-macOS-arm64.zip\`：Apple Silicon Mac 原生安装包
          - \`BlobfishNative-${version}-macOS-x64.zip\`：Intel Mac 原生安装包
          - \`blobfish-native-latest.json\`：原生版一键更新清单
          - 两个安装包均为纯 Swift / AppKit，不包含 Electron

          安装包已使用 Apple Developer ID 签名、Hardened Runtime 与 Apple 公证，并附带可供 Gatekeeper 离线验证的公证票据。
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            release/BlobfishNative-*-macOS-*.zip \
            release/blobfish-native-latest.json \
            --verify-tag \
            --title "水滴鱼 ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes-file release-notes.md \
            "${prerelease[@]}"
