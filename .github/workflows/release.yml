name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build native arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and native version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          native_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native-appkit/App/Info.plist)"
          test "$tag_version" = "$native_version"
      - name: Run native self-checks
        working-directory: native-appkit
        run: make test
      - name: Package native app
        working-directory: native-appkit
        run: make archive
      - name: Verify package architecture and signature
        shell: bash
        run: |
          set -euo pipefail
          app="native-appkit/.build/水滴鱼.app"
          executable="$app/Contents/MacOS/BlobfishNative"
          test "$(/usr/bin/uname -m)" = "arm64"
          test "$(/usr/bin/lipo -archs "$executable")" = "arm64"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-arm64
          path: native-appkit/.build/BlobfishNative-*-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-release-arm64
          path: release
      - name: Generate native update manifest
        run: node scripts/generate-native-release-manifest.js arm64
      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## 水滴鱼 2.0.0

          这是水滴鱼首个 Swift / AppKit 原生正式版，在保留角色、捏鱼、任务摩天轮、台词、闹钟、计时器、日历和一键更新等功能的同时，显著降低了常驻内存占用。

          - `BlobfishNative-2.0.0-macOS-arm64.zip`：Apple Silicon Mac 原生安装包
          - `blobfish-native-latest.json`：原生版一键更新清单
          - 2.0.0 不包含 Electron，也不提供 Intel 版本

          当前安装包使用 ad-hoc 签名，尚未获得 Apple Developer ID 公证。首次在其他 Mac 打开时可能仍需按 macOS 的安全提示确认。
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/BlobfishNative-*-macOS-arm64.zip
          release/blobfish-native-latest.json
          --verify-tag
          --title "水滴鱼 ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
