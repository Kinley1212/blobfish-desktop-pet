name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    name: Build native ${{ matrix.asset_arch }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift_arch: arm64
            asset_arch: arm64
          - swift_arch: x86_64
            asset_arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and native version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          native_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native-appkit/App/Info.plist)"
          test "$tag_version" = "$native_version"
      - name: Run native self-checks
        if: matrix.swift_arch == 'arm64'
        working-directory: native-appkit
        run: make test
      - name: Package ad-hoc signed app
        working-directory: native-appkit
        run: make app ARCH=${{ matrix.swift_arch }}
      - name: Archive ad-hoc signed app
        working-directory: native-appkit
        run: ARCH=${{ matrix.swift_arch }} sh scripts/archive-app.sh
      - name: Verify package architecture and signature
        shell: bash
        run: |
          set -euo pipefail
          app="native-appkit/.build/水滴鱼.app"
          executable="$app/Contents/MacOS/BlobfishNative"
          helper="$app/Contents/Resources/native/blobfish-agent-event-sender"
          test "$(/usr/bin/lipo -archs "$executable")" = "${{ matrix.swift_arch }}"
          test "$(/usr/bin/lipo -archs "$helper")" = "${{ matrix.swift_arch }}"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^Signature=//p')" = "adhoc"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.asset_arch }}
          path: native-appkit/.build/BlobfishNative-*-macOS-${{ matrix.asset_arch }}.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          path: release
          merge-multiple: true
      - name: Generate native update manifest
        run: node scripts/generate-native-release-manifest.js arm64 x64
      - name: Write release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<NOTES
          ## 水滴鱼 ${version}

          - \`BlobfishNative-${version}-macOS-arm64.zip\`：Apple Silicon Mac 原生安装包
          - \`BlobfishNative-${version}-macOS-x64.zip\`：Intel Mac 原生安装包
          - \`blobfish-native-latest.json\`：原生版一键更新清单
          - 两个安装包均为纯 Swift / AppKit，不包含 Electron

          本项目为自用桌宠，不使用付费 Apple Developer ID。安装包采用 ad-hoc 签名，未经 Apple 公证；macOS 首次打开时可能显示“无法验证开发者”，请在“系统设置 → 隐私与安全性”中确认打开。
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            release/BlobfishNative-*-macOS-*.zip \
            release/blobfish-native-latest.json \
            --verify-tag \
            --title "水滴鱼 ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes-file release-notes.md \
            "${prerelease[@]}"
